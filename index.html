<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F2A">
<meta name="robots" content="noindex, nofollow">
<title>ORBITE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icon-maskable-192.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="theme-cyberpunk.css" id="themeCss" media="not all">
<script>
// Thème choisi sur cet appareil, appliqué avant l’affichage pour éviter un flash.
(function () { var t = 'classique'; try { t = localStorage.getItem('orbite-theme') || t; } catch (e) {}
  if (t === 'cyberpunk') { document.getElementById('themeCss').media = 'all'; document.documentElement.dataset.theme = t;
    document.querySelector('meta[name=theme-color]').content = '#07060D'; } })();
</script>
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
